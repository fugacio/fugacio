name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: Rebuild measured holdout, process acceptance, and coverage matrix
        run: uv run --no-sync python scripts/qualify.py --output artifacts/qualification
      - name: Preserve qualification evidence, including failed and unsupported cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermodynamic-qualification
          path: artifacts/qualification
          if-no-files-found: error

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Pin every uv invocation (sync + run) to the matrix interpreter. Otherwise
      # `.python-version` (3.12) wins on the `uv run` steps, which rebuilds .venv
      # on 3.12 and drops the workspace packages (jax) the sync step installed --
      # so 3.11/3.13 silently retest 3.12 and mypy fails on the missing jax types.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages

      - name: Lint (ruff)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy

      - name: Import boundaries (import-linter)
        run: uv run --no-sync lint-imports

  test:
    runs-on: ubuntu-latest
    # Cold-cache XLA compilation is the long pole (the reference Helmholtz
    # solvers, the MESH column, the two-sided exchanger, and the EO Newton
    # systems each take minutes to compile); a warm cache finishes in minutes.
    # The suite is sharded into groups so every job fits comfortably in this
    # budget even cold, and the cap makes a pathological run fail cleanly (and
    # still save whatever it compiled) instead of hanging for the 6h default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # thermo:        fugacio-thermo (reference Helmholtz modules in their
        #                own processes, see below)
        # sim:           fugacio-sim unit operations, reactors, dynamics, control,
        #                economics, heat integration
        # flowsheeting:  the recycle partitioner and equation-oriented engine
        # Compile columns, exchangers, and each plant on separate runners so
        # their cold compilation times don't accumulate against one timeout.
        group:
          - thermo
          - sim
          - flowsheeting
          - distillation
          - heat-exchanger
          - plant-hda
          - plant-c3
          - plant-ew
          - utility-reliability
          - copilot
    env:
      # Pin every uv invocation (sync + run) to the matrix interpreter. Otherwise
      # `.python-version` (3.12) wins on the `uv run` steps, which rebuilds .venv
      # on 3.12 and drops the workspace packages (jax) the sync step installed --
      # so 3.11/3.13 silently retest 3.12 and mypy fails on the missing jax types.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages

      # The persistent JAX cache (conftest.py) makes warm runs cheap. Restore
      # and save are split so the cache is written even when a later step fails
      # (see the matching save step): the first run to survive long enough to
      # compile the solvers warms the cache for every run after it. The key
      # carries the group because each group compiles a different set of graphs.
      # Include the commit so new solver graphs can be saved after restoring an
      # older cache; an existing cache key is immutable.
      - name: Restore JAX compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.group }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.group }}-${{ hashFiles('uv.lock') }}-
            jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.group }}-

      # JAX keeps every compiled XLA executable alive for the life of the
      # process, so a group that jit-compiles dozens of float64 solver graphs
      # climbs to many GB of resident memory on a cold cache -- enough to get the
      # runner killed ("lost communication") before the cache is saved, so it
      # never warms. The heaviest modules therefore run in their own processes,
      # which releases that memory between them; the shared on-disk .jax_cache
      # de-duplicates compilation across the processes.
      - name: Tests (pytest)
        # Leave time to save compiled graphs even if the tests time out.
        timeout-minutes: 55
        run: |
          set -euo pipefail
          run() { uv run --no-sync pytest -vv --durations=10 "$@"; }
          case "${{ matrix.group }}" in
            thermo)
              heavy=(
                packages/fugacio-thermo/tests/test_helmholtz.py
                packages/fugacio-thermo/tests/test_helmholtz_consistency.py
              )
              for module in "${heavy[@]}"; do run "$module"; done
              run packages/fugacio-thermo/tests "${heavy[@]/#/--ignore=}"
              ;;
            sim)
              flowsheeting=(
                packages/fugacio-sim/tests/test_distillation.py
                packages/fugacio-sim/tests/test_eo.py
                packages/fugacio-sim/tests/test_eo_reliability.py
                packages/fugacio-sim/tests/test_utility_reliability.py
                packages/fugacio-sim/tests/test_flowsheet.py
                packages/fugacio-sim/tests/test_heat_exchanger.py
                packages/fugacio-sim/tests/test_plants.py
              )
              run packages/fugacio-sim/tests/test_utilities.py
              run packages/fugacio-sim/tests \
                --ignore=packages/fugacio-sim/tests/test_utilities.py \
                "${flowsheeting[@]/#/--ignore=}"
              ;;
            flowsheeting)
              run packages/fugacio-sim/tests/test_eo.py
              run packages/fugacio-sim/tests/test_eo_reliability.py
              run packages/fugacio-sim/tests/test_flowsheet.py
              ;;
            distillation)
              run packages/fugacio-sim/tests/test_distillation.py
              ;;
            heat-exchanger)
              run packages/fugacio-sim/tests/test_heat_exchanger.py
              ;;
            plant-hda)
              run packages/fugacio-sim/tests/test_plants.py::test_hda_lite_plant_closes_and_meets_specs
              ;;
            plant-c3)
              # Release the balance/specification executables before compiling
              # the full plant derivative. Report peak memory and signal exits
              # to distinguish resource failures from solver/test failures.
              for test in test_depropanizer_with_economiser_loop test_depropanizer_economiser_sensitivity; do
                /usr/bin/time -v uv run --no-sync pytest -vv --durations=10 \
                  "packages/fugacio-sim/tests/test_plants.py::$test"
              done
              ;;
            plant-ew)
              run packages/fugacio-sim/tests/test_plants.py::test_ethanol_water_train_recovers_bottoms_heat
              ;;
            utility-reliability)
              run packages/fugacio-sim/tests/test_utility_reliability.py
              ;;
            copilot)
              run packages/fugacio-copilot/tests/test_steam_tools.py
              run packages/fugacio-copilot/tests \
                --ignore=packages/fugacio-copilot/tests/test_steam_tools.py
              ;;
            *)
              echo "Unknown test group: ${{ matrix.group }}" >&2
              exit 1
              ;;
          esac

      - name: Save JAX compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.group }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
