name: Oracles

# Differential testing against external reference codes (CoolProp, thermo,
# chemicals, Cantera). The reference packages are pinned in uv.lock and nothing
# touches the network at test time, so the suite is deterministic and fast
# enough to run on every pull request alongside the unit suite. The weekly
# schedule is a canary for environment drift on quiet periods. The separate
# Julia job uses pinned Julia/Clapeyron versions and a committed Manifest.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: oracles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clapeyron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      JULIA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10.10"
      - uses: julia-actions/cache@v2
      - name: Instantiate the locked Clapeyron environment
        run: julia --project=scripts/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Generate matched-parameter PC-SAFT cases
        run: uv run --no-sync python scripts/clapeyron_oracle.py generate oracle-input.json
      - name: Evaluate the independent Julia implementation
        run: julia --project=scripts/julia scripts/julia/oracle.jl oracle-input.json oracle-output.json
      - name: Require complete results and compare kernels
        run: uv run --no-sync python scripts/clapeyron_oracle.py verify oracle-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clapeyron-oracle
          path: oracle-*.json
          if-no-files-found: error

  oracles:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync workspace (with oracle reference packages)
        run: uv sync --locked --all-packages --group oracles

      # See ci.yml: reuses jit-compiled Helmholtz solver binaries across runs.
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-oracles-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: jax-oracles-${{ runner.os }}-

      - name: Differential tests vs reference codes
        run: uv run --no-sync pytest -m oracle
